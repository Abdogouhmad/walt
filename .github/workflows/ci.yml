name: ci

# Quality gate for every pull request and every push to `main`. Mirrors the
# checks a contributor is expected to run locally (see CONTRIBUTING.md):
# formatting, static analysis and the test suite. The release pipeline lives in
# `release.yml` and only runs on `main`, so this is the fast feedback loop.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer commit on the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-debug-apk:
    name: Debug APK smoke build
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      # Smoke test only: a debug build needs no signing secrets and proves the
      # Android toolchain still assembles before a release is attempted.
      - name: Build debug APK
        run: flutter build apk --debug
