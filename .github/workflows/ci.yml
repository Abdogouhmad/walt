name: ci

# Fast quality gate for every pull request and every push to `main`: only
# formatting and static analysis, which take seconds.
#
# The test suite renders real screens and runs for tens of minutes on CI, which
# made every push wait on it (and the `build-debug-apk` job wait behind it). It
# is off the critical path now: it runs on a weekly schedule and on demand from
# the Actions tab (`workflow_dispatch`). Run `flutter test` locally before
# opening a pull request.
on:
  pull_request:
  push:
    branches:
      - main
  # Weekly full-suite run, off the critical path.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# A newer commit on the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format & analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

  # Heavy widget suite. Deliberately not triggered by push/PR — see the header.
  test:
    name: Test suite (weekly / manual)
    needs: quality
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-debug-apk:
    name: Debug APK smoke build
    runs-on: ubuntu-latest
    # Decoupled from the test job so a slow/failing suite can never hold up the
    # build. The release workflow builds the real, signed APKs on `main`.
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      # Smoke test only: a debug build needs no signing secrets and proves the
      # Android toolchain still assembles before a release is attempted.
      - name: Build debug APK
        run: flutter build apk --debug
