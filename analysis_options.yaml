include: package:flutter_lints/flutter.yaml

# Customize lint rules here
linter:
  rules:
    # `print` writes to stdout on every platform and is stripped from release
    # builds. Use `debugPrint`/`dart:developer` `log` instead.
    avoid_print: true

    # Prefer immutable locals and const literals/constructors: less mutable
    # state, cheaper rebuilds, and the compiler can canonicalise instances.
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_final_locals: true

    # Surfaces a widget running a `Future` after its `BuildContext` may be
    # unmounted, and dropped futures awaiting on nothing.
    use_build_context_synchronously: true
    unawaited_futures: true

    # Consistency / readability.
    directives_ordering: true
    prefer_single_quotes: true
    unnecessary_brace_in_string_interps: true

analyzer:
  errors:
    # Required for Freezed + json_serializable
    invalid_annotation_target: ignore

  # Optional but recommended: exclude generated files from analysis
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - "lib/**/*.g.dart"      # safety
    - "lib/**/*.freezed.dart"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  # Optional: Enable stricter checks (good for production apps)
  # language:
  #   strict-casts: true
  #   strict-raw-types: true
